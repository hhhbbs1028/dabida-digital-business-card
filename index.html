<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="디지털 명함을 만들고 교환하는 서비스 - Dabida" />
    <meta name="theme-color" content="#3182f6" />
    
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Paperlogy Font (public/fonts/Paperlogy-4Regular.woff2 파일 필요) -->
    <style>
      @font-face {
        font-family: 'Paperlogy-4Regular';
        src: url('/fonts/Paperlogy-4Regular.woff2') format('woff2'),
             url('/fonts/Paperlogy-4Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dabida" />
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/AppImages/ios/180.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/AppImages/ios/167.png" sizes="167x167" />
    <link rel="apple-touch-icon" href="/AppImages/ios/152.png" sizes="152x152" />
    <link rel="apple-touch-icon" href="/AppImages/ios/120.png" sizes="120x120" />
    <link rel="apple-touch-icon" href="/AppImages/ios/114.png" sizes="114x114" />
    <link rel="apple-touch-icon" href="/AppImages/ios/1024.png" sizes="1024x1024" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/AppImages/ios/32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/AppImages/ios/16.png" />
    
    <title>Dabida - 디지털 명함 스튜디오</title>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
